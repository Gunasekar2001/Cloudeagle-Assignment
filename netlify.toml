# Netlify deployment configuration.
# Netlify reads this file automatically on deploy.
[build]
  # Install deps and produce the static bundle in dist/.
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin a modern Node so the build matches local dev.
  NODE_VERSION = "20"

# Single-page-app fallback: serve index.html for any route so client-side
# navigation never 404s on a hard refresh / deep link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
